name: Documentation

# The book is built from `docs/` and published to GitHub Pages. The pull
# request runs only validate the build; the deployment happens on `main`.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "xtask/**"
      - "Cargo.toml"
      - "openapi/timeweb-cloud.json"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "src/**"
      - "xtask/**"
      - "Cargo.toml"
      - "openapi/timeweb-cloud.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: "0.5.4"
  MDBOOK_SHA256: "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7"
  D2_VERSION: "0.9.0"
  D2_SHA256: "5669ddc46b99e942cc96078f4a4e36d5e62103348f4c05179ede27802fdd87a9"

jobs:
  build:
    name: Build the book
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mdBook
        run: |
          set -euo pipefail
          tarball="mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/${tarball}"
          curl -fsSL --proto '=https' --tlsv1.2 -o "/tmp/${tarball}" "$url"
          echo "${MDBOOK_SHA256}  /tmp/${tarball}" | sha256sum --check --strict -
          tar -xzf "/tmp/${tarball}" -C "$HOME/.cargo/bin"
      - name: Install d2
        run: |
          set -euo pipefail
          tarball="d2-v${D2_VERSION}-linux-amd64.tar.gz"
          url="https://github.com/d2lang/d2/releases/download/v${D2_VERSION}/${tarball}"
          curl -fsSL --proto '=https' --tlsv1.2 -o "/tmp/${tarball}" "$url"
          echo "${D2_SHA256}  /tmp/${tarball}" | sha256sum --check --strict -
          mkdir -p /tmp/d2
          tar -xzf "/tmp/${tarball}" -C /tmp/d2 --strip-components=1
          echo "/tmp/d2/bin" >> "$GITHUB_PATH"
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Check that the generated pages are up to date
        run: cargo xtask api-index --check
      - name: Check that the diagrams are up to date
        run: |
          set -euo pipefail
          ./docs/diagrams/render.sh /tmp/diagrams
          for source in docs/diagrams/*.d2; do
            svg="/tmp/diagrams/$(basename "$source" .d2).svg"
            diff --unified "docs/img/$(basename "$svg")" "$svg" \
              || { echo "run docs/diagrams/render.sh and commit the result"; exit 1; }
          done
      - name: Compile the documentation examples
        run: |
          set -euo pipefail
          cargo build --tests
          # Since Cargo 1.100 the intermediate artifact layout is not a stable
          # interface, so the doctest library search path is collected from
          # Cargo's JSON messages instead of hard-coding target/debug/deps.
          lib_dirs="$(cargo build --tests --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact") | .filenames[]?' \
            | xargs -r -n1 dirname | sort -u | paste -sd, -)"
          mdbook test docs/en -L "$lib_dirs"
          mdbook test docs/ru -L "$lib_dirs"
      - name: Build the book
        run: |
          mdbook build docs/en -d public
          mdbook build docs/ru -d public/ru
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload the book
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@5f327015a708106f6f1b7c9a633901af30fe80cb # v5
        with:
          path: public

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
