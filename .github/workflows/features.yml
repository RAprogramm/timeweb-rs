name: Feature partitioning

# The area features are generated by openapi/generate_feature_gates.py;
# CI's main matrix builds --all-features only, so without this check a
# partial build (one area, or no areas at all) could silently break —
# e.g. a gated model referenced by an unconditional one.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  partial-builds:
    name: Partial feature builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        features:
          - "native-tls"
          - "native-tls,servers"
          - "rustls,full"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo check --no-default-features --features "${{ matrix.features }}"
