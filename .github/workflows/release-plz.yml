name: Release-plz

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'RAprogramm' }}
    environment: release
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    steps:
      - name: Mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_PLZ_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Authenticate to crates.io
        id: crates_auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
      - name: Run release-plz
        uses: release-plz/action@b2baf303c463c223526d52a8a91b0777f052cf3f # v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token }}

  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'RAprogramm' }}
    needs: release-plz-release
    timeout-minutes: 30
    steps:
      - name: Mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_PLZ_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Run release-plz
        uses: release-plz/action@b2baf303c463c223526d52a8a91b0777f052cf3f # v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
