name: API spec sync

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: spec-sync
  cancel-in-progress: false

env:
  SPEC_URL: https://timeweb.cloud/api-docs-data/bundle.json

jobs:
  sync:
    name: Check and regenerate from upstream spec
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pr_number: ${{ steps.pr.outputs.pull-request-number }}
      head_sha: ${{ steps.pr.outputs.pull-request-head-sha }}
      breaking: ${{ steps.semver.outputs.breaking }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download the latest Timeweb Cloud spec
        run: curl -fsSL -o /tmp/latest.json "$SPEC_URL"

      - name: Detect spec changes
        id: diff
        run: |
          if cmp -s openapi/timeweb-cloud.json /tmp/latest.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Spec is unchanged."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Spec changed upstream."
          fi

      - name: Install Java
        if: steps.diff.outputs.changed == 'true'
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install nightly rustfmt
        if: steps.diff.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          components: rustfmt

      - name: Install stable Rust
        if: steps.diff.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: steps.diff.outputs.changed == 'true'

      - name: Regenerate the SDK from the new spec
        id: regen
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        run: |
          cp openapi/timeweb-cloud.json /tmp/base-spec.json
          cp /tmp/latest.json openapi/timeweb-cloud.json
          python3 openapi/normalize_spec.py openapi/timeweb-cloud.json /tmp/normalized.json
          npx --yes @openapitools/openapi-generator-cli@latest generate \
            -i /tmp/normalized.json -g rust -o /tmp/twgen \
            -p packageName=timeweb_client,library=reqwest
          rm -rf src/apis src/models
          cp -r /tmp/twgen/src/apis src/apis
          cp -r /tmp/twgen/src/models src/models
          python3 openapi/update_readme.py
          cargo +nightly fmt

      - name: Verify the regenerated SDK
        id: verify
        if: steps.diff.outputs.changed == 'true' && steps.regen.outcome == 'success'
        continue-on-error: true
        run: |
          cargo build --all-features
          cargo test --all-features

      - name: Install cargo-semver-checks
        if: >-
          steps.diff.outputs.changed == 'true'
          && steps.regen.outcome == 'success'
          && steps.verify.outcome == 'success'
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2
        with:
          tool: cargo-semver-checks

      - name: Classify the regeneration with cargo-semver-checks
        id: semver
        if: >-
          steps.diff.outputs.changed == 'true'
          && steps.regen.outcome == 'success'
          && steps.verify.outcome == 'success'
        run: |
          if cargo semver-checks --all-features --baseline-rev HEAD; then
            echo "breaking=false" >> "$GITHUB_OUTPUT"
          else
            echo "breaking=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize the API changes with oasdiff
        if: >-
          steps.diff.outputs.changed == 'true'
          && steps.regen.outcome == 'success'
          && steps.verify.outcome == 'success'
        env:
          OASDIFF_VERSION: "1.23.0"
        run: |
          curl -fsSL -o /tmp/oasdiff.tar.gz \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/oasdiff.tar.gz -C /tmp oasdiff
          /tmp/oasdiff changelog /tmp/base-spec.json /tmp/latest.json \
            --format markdown > /tmp/api-changes.md || true

      - name: Compose the pull request body
        if: >-
          steps.diff.outputs.changed == 'true'
          && steps.regen.outcome == 'success'
          && steps.verify.outcome == 'success'
        env:
          BREAKING: ${{ steps.semver.outputs.breaking }}
        run: |
          {
            echo "The upstream Timeweb Cloud OpenAPI specification changed."
            echo
            echo "This pull request was opened automatically: it vendors the new"
            echo "spec, regenerates \`src/apis\` and \`src/models\` and refreshes"
            echo "the README statistics. The regenerated SDK builds and its tests"
            echo "pass."
            echo
            if [ "$BREAKING" = "true" ]; then
              echo "**cargo-semver-checks reports breaking changes** (or could"
              echo "not complete); this pull request stays open for review."
            else
              echo "cargo-semver-checks found no breaking changes; this pull"
              echo "request merges automatically once CI is green."
            fi
            echo
            echo "## API changes"
            echo
            if [ -s /tmp/api-changes.md ]; then
              head -c 60000 /tmp/api-changes.md
              if [ "$(stat -c%s /tmp/api-changes.md)" -gt 60000 ]; then
                echo
                echo "_Summary truncated; see the spec diff for the rest._"
              fi
            else
              echo "_No summary available (oasdiff produced no output)._"
            fi
          } > /tmp/pr-body.md

      - name: Mint GitHub App token
        id: app_token
        if: >-
          steps.diff.outputs.changed == 'true'
          && steps.regen.outcome == 'success'
          && steps.verify.outcome == 'success'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_PLZ_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      - name: Open a pull request with the update
        id: pr
        if: >-
          steps.diff.outputs.changed == 'true'
          && steps.regen.outcome == 'success'
          && steps.verify.outcome == 'success'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app_token.outputs.token }}
          branch: automated/timeweb-api-update
          delete-branch: true
          title: >-
            ${{ steps.semver.outputs.breaking == 'true'
                && 'feat!: regenerate SDK from updated Timeweb API spec'
                || 'feat: regenerate SDK from updated Timeweb API spec' }}
          commit-message: >-
            ${{ steps.semver.outputs.breaking == 'true'
                && 'feat!: regenerate SDK from updated Timeweb API spec'
                || 'feat: regenerate SDK from updated Timeweb API spec' }}
          body-path: /tmp/pr-body.md

      - name: Label breaking updates
        if: >-
          steps.pr.outputs.pull-request-number != ''
          && steps.semver.outputs.breaking == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create breaking-change \
            --description "Changes the public API surface" \
            --color B60205 --force
          gh pr edit "${{ steps.pr.outputs.pull-request-number }}" \
            --add-label breaking-change

      - name: Close stale spec-update failure issues
        if: steps.pr.outputs.pull-request-url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          gh issue list --state open \
            --search 'Timeweb API spec in:title' \
            --json number --jq '.[].number' |
          while read -r issue; do
            gh issue close "$issue" --comment \
              "Superseded by the automated regeneration pull request: $PR_URL"
          done

      - name: Open an issue when automatic update fails
        if: >-
          steps.diff.outputs.changed == 'true'
          && (steps.regen.outcome == 'failure' || steps.verify.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          open_issues=$(gh issue list --state open \
            --search 'Timeweb API spec in:title' --json number --jq 'length')
          if [ "$open_issues" -gt 0 ]; then
            echo "A spec-update issue is already open; skipping."
            exit 0
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "The upstream Timeweb Cloud OpenAPI specification changed, but"
            echo "automatic regeneration failed."
            echo
            echo "- regenerate: ${{ steps.regen.outcome }}"
            echo "- verify: ${{ steps.verify.outcome }}"
            echo
            echo "The spec normalizer or generator settings likely need a manual"
            echo "update. Failed run: ${run_url}"
          } > /tmp/issue-body.md
          gh issue create \
            --title "Timeweb API spec changed — manual SDK update required" \
            --body-file /tmp/issue-body.md

  automerge:
    name: Merge compatible updates after green CI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: sync
    if: >-
      needs.sync.outputs.pr_number != ''
      && needs.sync.outputs.breaking == 'false'
    steps:
      - name: Wait for the CI workflow to succeed on the PR head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.sync.outputs.pr_number }}
          HEAD_SHA: ${{ needs.sync.outputs.head_sha }}
        run: |
          if [ -z "$HEAD_SHA" ]; then
            HEAD_SHA=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --json headRefOid --jq .headRefOid)
          fi
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          run_id=""
          for _ in $(seq 1 30); do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml --commit "$HEAD_SHA" \
              --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run_id" ] && break
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "No CI run appeared for $HEAD_SHA." >&2
            exit 1
          fi
          gh run watch --repo "$GITHUB_REPOSITORY" "$run_id" \
            --interval 30 --exit-status

      - name: Mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_PLZ_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      - name: Merge the update
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          PR_NUMBER: ${{ needs.sync.outputs.pr_number }}
        run: |
          gh pr merge --repo "$GITHUB_REPOSITORY" --squash \
            --match-head-commit "$HEAD_SHA" "$PR_NUMBER"
