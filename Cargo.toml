[package]
name = "timeweb-rs"
version = "0.7.0"
edition = "2024"
rust-version = "1.96"
description = "Async Rust SDK for the Timeweb Cloud API"
license = "MIT"
repository = "https://github.com/RAprogramm/timeweb-rs"
homepage = "https://github.com/RAprogramm/timeweb-rs"
documentation = "https://docs.rs/timeweb-rs"
readme = "README.md"
keywords = ["timeweb", "cloud", "sdk", "api"]
categories = ["api-bindings", "asynchronous"]
exclude = ["/.github", "/openapi", "/openapitools.json", "/release-plz.toml"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_with = { version = "3", default-features = false, features = [
  "base64",
  "std",
  "macros",
] }
serde_json = "1"
serde_repr = "0.1"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
futures-core = "0.3"
tokio = { version = "1", features = ["fs", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "multipart",
  "stream",
  "query",
  "form",
] }

[features]
default = ["native-tls", "full"]
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]
# BEGIN generated area features — openapi/generate_feature_gates.py
account = []
ai-agents = []
apps = []
balancers = []
container-registry = []
databases = []
dedicated-servers = []
domains = []
firewall = []
floating-ip = []
images = []
knowledge-bases = []
kubernetes = []
locations = []
mail = []
network-drives = []
payments = []
projects = []
routers = []
s3 = []
servers = []
ssh = []
vpc = []
full = ["account", "ai-agents", "apps", "balancers", "container-registry", "databases", "dedicated-servers", "domains", "firewall", "floating-ip", "images", "knowledge-bases", "kubernetes", "locations", "mail", "network-drives", "payments", "projects", "routers", "s3", "servers", "ssh", "vpc"]
# END generated area features

[dev-dependencies]
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[package.metadata.docs.rs]
all-features = true

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
