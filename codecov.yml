# Codecov configuration — https://docs.codecov.com/docs/codecovyml-reference
#
# The whole repository is uploaded, so the dashboard shows the coverage of
# every file — the generated `src/apis` and `src/models` modules and the
# `xtask` tooling included.
#
# The quality gate — the badge and the status checks — is measured on the
# hand-written layer of the published crate only: the generated code comes
# out of `openapi-generator` and carries no hand-written logic, so its
# coverage is not a quality signal.

coverage:
  status:
    project:
      default:
        target: 95%
        threshold: 1%
        paths:
          - src/client.rs
          - src/datetime.rs
          - src/error_body.rs
          - src/pagination.rs
          - src/retry.rs
    patch:
      default:
        target: 95%
        paths:
          - src/client.rs
          - src/datetime.rs
          - src/error_body.rs
          - src/pagination.rs
          - src/retry.rs

# The README badge points at this component, so it shows the coverage of the
# hand-written layer instead of the whole repository, which is dominated by
# the generated `src/apis` and `src/models` modules.
component_management:
  individual_components:
    - component_id: hand_written
      name: Hand-written
      paths:
        - src/client.rs
        - src/datetime.rs
        - src/error_body.rs
        - src/pagination.rs
        - src/retry.rs

comment:
  layout: "condensed_header, diff, flags, files"
  require_changes: false
