[book]
title = "timeweb-rs"
description = "Асинхронный Rust SDK для API Timeweb Cloud"
authors = ["RAprogramm"]
language = "ru"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/RAprogramm/timeweb-rs"
site-url = "/timeweb-rs/ru/"
# `css/extra.css` is a symlink into `docs/css`, so both books ship one copy of
# the shared stylesheet. mdBook copies an additional file to the output under
# the very path written here, so the path must stay inside the book: a `..`
# prefix would place the asset outside the published directory. The script of
# the language switch is loaded from `theme/head.hbs` instead, because it has
# to run before the page is painted.
additional-css = ["css/extra.css"]

[rust]
edition = "2024"

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 2
boost-paragraph = 1

[output.html.print]
enable = true

[output.html.playground]
editable = false
