# release-plz configuration — https://release-plz.dev/docs/config
#
# The crate now uses Conventional Commits (`feat:`/`fix:`/`chore:`/`ci:`/
# `docs:`/`refactor:`/`test:`, with `!` for breaking changes). release-plz still
# verifies the actual public-API surface with `cargo-semver-checks`, but the
# commit type drives both the changelog grouping below and the version bump.

[changelog]
# Keep the existing Keep a Changelog + SemVer preamble verbatim so a regenerated
# file is byte-identical to the curated one.
header = """# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""

# Tera template for each released version block. Produces:
#   ## [x.y.z](compare/vA...vB) - DATE
#   ### Added / Fixed / Changed / Performance / Documentation
#   - message ([#PR](pull/PR))   (or a commit link when there is no PR)
# The `<!-- n -->` group prefixes force a stable section order and are stripped
# from the rendered title. A release that carries breaking changes opens with a
# GitHub alert, so the warning is visible before the entries.
body = """

## [{{ version | trim_start_matches(pat="v") }}]\
{% if release_link %}({{ release_link }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{% set_global has_breaking = false %}
{% for commit in commits %}
{% if commit.breaking %}{% set_global has_breaking = true %}{% endif %}
{% endfor %}
{% if has_breaking %}
> [!WARNING]
> This release changes the public API of the crate. The entries marked
> **BREAKING:** below describe what a consumer has to adapt to.
{% endif %}
| Section | Changes |
| --- | ---: |
{% for group, group_commits in commits | group_by(attribute="group") -%}
| {{ group | striptags | trim | upper_first }} | {{ group_commits | length }} |
{% endfor -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
{% if commit.breaking %}**BREAKING:** {% endif %}\
{{ commit.message | upper_first }}\
{% if commit.remote.pr_number %} ([#{{ commit.remote.pr_number }}](https://github.com/RAprogramm/timeweb-rs/pull/{{ commit.remote.pr_number }}))\
{% else %} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/RAprogramm/timeweb-rs/commit/{{ commit.id }}))\
{% endif %}
{% endfor %}
{% endfor %}
"""

# Keep breaking changes in the changelog even if their type would be skipped.
protect_breaking_commits = true
sort_commits = "newest"

# PR titles follow the `#N type: description` convention (branch-per-issue
# workflow). git-cliff only recognizes the conventional type when it is the
# first token, so the leading issue reference is stripped before parsing —
# without this every squashed commit lands in the "Other" group.
commit_preprocessors = [{ pattern = '^#\d+ +', replace = "" }]

commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Testing" },
  { message = "^revert", group = "<!-- 6 -->Reverted" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^build", skip = true },
  { message = "^style", skip = true },
  { message = ".*", group = "<!-- 9 -->Other" },
]

[workspace]
# The body of the pull request that release-plz opens for the release. The
# default template prints the report of cargo-semver-checks as a wall of text
# between the heading and the changelog; this one keeps the same information,
# but behind an alert and a collapsible block.
pr_body = """
## 🤖 New release
{% for release in releases %}
* `{{ release.package }}`: {% if release.previous_version and release.previous_version != release.next_version %}{{ release.previous_version }} -> {% endif %}{{ release.next_version }}{% if release.semver_check == "incompatible" %} (⚠ API breaking changes){% elif release.semver_check == "compatible" %} (✓ API compatible changes){% endif %}
{%- endfor %}
{%- for release in releases %}
{%- if release.breaking_changes %}
{%- set blocks = release.breaking_changes | split(pat="--- ") %}

> [!WARNING]
> The release changes the public API of the crate. The report of
> cargo-semver-checks is summarised below: every lint is listed with the number
> of the API items it found, and the items themselves are under the heading of
> their lint.

| Lint | Found |
|---|---:|
{%- set_global reported = 0 %}
{%- for block in blocks %}
{%- if "Failed in:" in block %}
{%- set lint = block | split(pat="\n") | first | trim(pat="-") | trim | split(pat=": ") | first | split(pat=" ") | last %}
{%- set_global found = 0 %}
{%- for line in block | split(pat="Failed in:") | last | split(pat="\n") | unique %}
{%- if line | trim | length > 0 %}{% set_global found = found + 1 %}{% endif %}
{%- endfor %}
| `{{ lint }}` | {{ found }} |
{%- set_global reported = reported + 1 %}
{%- endif %}
{%- endfor %}

<details>
<summary><b>The report of cargo-semver-checks</b> — {{ reported }} lints reported a difference</summary>
{%- for block in blocks %}
{%- if "Failed in:" in block %}
{%- set head = block | split(pat="\n") | first | trim(pat="-") | trim %}
{%- set kind = head | split(pat=" ") | first %}
{%- set lint = head | split(pat=": ") | first | split(pat=" ") | last %}
{%- set title = head | replace(from=kind ~ " " ~ lint ~ ": ", to="") | trim(pat="-") | trim %}

#### `{{ lint }}` — {{ title }}

{{ block | split(pat="Description:") | last | split(pat="\n") | nth(n=1) | trim }}

Lint: <{{ block | split(pat="impl: ") | last | split(pat="\n") | first | trim }}>
{% for line in block | split(pat="Failed in:") | last | split(pat="\n") | unique %}
{%- set item = line | trim %}
{%- if item | length > 0 %}
{%- set parts = item | split(pat="/timeweb-rs/") %}
{%- if parts | length > 1 %}
- {{ parts | first | split(pat="/tmp/") | first }}{{ parts | last }}
{%- else %}
- {{ item }}
{%- endif %}
{%- endif %}
{%- endfor %}
{%- endif %}
{%- endfor %}

</details>
{%- endif %}
{%- endfor %}
{% if changes %}
<details>
<summary><b>Changelog</b></summary>

{{ changes }}

</details>
{% endif %}
---
This PR was generated with [release-plz](https://github.com/release-plz/release-plz/).
"""

